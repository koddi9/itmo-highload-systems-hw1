spring.application.name=items-service
server.port=8080
spring.threads.virtual.enabled=true

# Метрики Prometheus на GET /metrics, остальные эндпоинты actuator закрыты.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics

# Под и датацентр приходят из окружения.
management.metrics.tags.pod=${POD_ID:local}
management.metrics.tags.datacenter=${DATACENTER:local}

chaos.failure-rate=${FAILURE_RATE:0}
chaos.latency-mean=${LATENCY_MEAN_MS:0}ms
