apiVersion: 1

datasources:
  - name: Prometheus
    # Дашборд ссылается на datasource по этому uid.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Равен scrape_interval, чтобы $__rate_interval покрывал несколько скрейпов.
      timeInterval: 5s
      httpMethod: POST
